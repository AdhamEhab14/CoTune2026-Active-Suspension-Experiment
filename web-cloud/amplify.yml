version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps --no-audit --no-fund
    build:
      commands:
        - GENERATE_SOURCEMAP=false INLINE_RUNTIME_CHUNK=false DISABLE_ESLINT_PLUGIN=true NODE_OPTIONS=--max_old_space_size=7168 npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
